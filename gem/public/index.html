<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찬란한 보석상 · 보석 수집 보드게임</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;900&family=Cinzel:wght@700;900&family=Cormorant+Garamond:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="conn" id="conn" hidden></div>

<section id="home" class="screen">
  <div class="home">
    <div class="hero">
      <img class="hero-box" src="assets/box.svg" alt="">
      <div class="hero-text">
        <p class="kicker">르네상스 보석 상인의 경제 게임</p>
        <h1 class="title">찬란한<br>보석상</h1>
        <p class="en">SPLENDID JEWELERS</p>
        <p class="tagline">원석을 모아 광산과 공방을 사들이고,<br>귀족의 후원을 받아 가장 먼저 15점을 모으세요.</p>
      </div>
    </div>
    <div class="join-card">
      <div class="jc-head">상인 조합</div>
      <label class="lbl" for="nameInput">이름</label>
      <input id="nameInput" class="input" maxlength="10" placeholder="닉네임 (최대 10자)" autocomplete="off">
      <button id="createBtn" class="btn btn-gold btn-lg wide">새 방 만들기</button>
      <div class="or"><span>또는 초대 코드로 입장</span></div>
      <div class="join-row">
        <input id="codeInput" class="input code" maxlength="4" placeholder="ABCD" autocomplete="off">
        <button id="joinBtn" class="btn btn-lg">입장</button>
      </div>
      <button class="btn wide" data-rules>게임 방법 보기</button>
    </div>
  </div>
</section>

<section id="lobby" class="screen" hidden>
  <header class="bar">
    <div class="bar-brand"><img src="assets/logo.svg" alt=""><span>찬란한 보석상</span></div>
    <div class="bar-mid"><span class="muted">초대 코드</span><b id="lobbyCode" class="code-b">----</b><button class="btn btn-sm" id="copyLinkBtn">초대 링크 복사</button></div>
    <div class="bar-right">
      <button class="btn btn-sm" data-rules>룰</button>
      <button class="icon-btn" data-mute title="소리 켜기/끄기"><i class="ic ic-volume"></i></button>
      <button class="btn btn-sm" data-leave>나가기</button>
    </div>
  </header>
  <div class="lobby">
    <div class="lobby-main">
      <h2 class="h2">상인들 <small>2~4명 · 차례는 시작할 때 무작위</small></h2>
      <div id="seatGrid" class="seat-grid"></div>
      <div id="spectators" class="spectators"></div>
      <div class="lobby-actions">
        <button id="addBotBtn" class="btn">AI 보석상 추가</button>
        <button id="seatBtn" class="btn">관전으로 전환</button>
        <div class="grow"></div>
        <span id="startHint" class="hint"></span>
        <button id="startBtn" class="btn btn-gold btn-lg">거래 시작</button>
      </div>
    </div>
    <aside class="panel lobby-side" id="lobbyChatMount"></aside>
  </div>
</section>

<section id="game" class="screen" hidden>
  <header class="bar">
    <div class="bar-brand"><img src="assets/logo.svg" alt=""><span>찬란한 보석상</span><em id="gameCode"></em></div>
    <div id="turnBanner" class="turn-banner"></div>
    <div class="bar-right">
      <button class="btn btn-sm" data-rules>룰</button>
      <button class="icon-btn" data-mute title="소리 켜기/끄기"><i class="ic ic-volume"></i></button>
      <button class="btn btn-sm" id="hostLobbyBtn" hidden>대기실로</button>
      <button class="btn btn-sm" data-leave>나가기</button>
    </div>
  </header>
  <div class="game">
    <aside class="opponents" id="opponents"></aside>
    <main class="table">
      <div class="nobles" id="nobles"></div>
      <div class="market" id="market"></div>
      <div class="bank" id="bank"></div>
    </main>
    <aside class="side panel">
      <nav class="tabs" id="tabs">
        <button data-tab="log" class="on">기록</button>
        <button data-tab="chat">대화<span class="badge" id="chatBadge" hidden></span></button>
      </nav>
      <div class="tab" id="tab-log"></div>
      <div class="tab tab-chat" id="tab-chat" hidden></div>
    </aside>
    <section class="me" id="me"></section>
  </div>
</section>

<a class="back-hub" id="backHub" href="/">← 다른 보드게임 고르기</a>
<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toasts" class="toasts"></div>
<div id="fly" class="fly-layer"></div>

<template id="chatTpl">
  <div class="chat">
    <div class="chat-log"></div>
    <form class="chat-form"><input class="input" maxlength="200" placeholder="메시지 입력" autocomplete="off"><button class="btn btn-gold btn-sm" type="submit">보내기</button></form>
  </div>
</template>

<script src="/socket.io/socket.io.js"></script>
<script src="shared/gem.js"></script>
<script src="js/sfx.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
