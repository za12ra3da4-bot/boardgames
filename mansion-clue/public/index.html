<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밤의 저택 · 살인 추리 게임</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700;900&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&family=Cinzel:wght@700;900&family=Special+Elite&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/anim/anim.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="rain" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="conn" id="conn" hidden>서버와 연결이 끊겼습니다. 다시 연결하는 중...</div>

<!-- 시작 화면 -->
<section id="home" class="screen">
  <div class="home">
    <div class="home-hero">
      <img class="home-logo" src="assets/logo.svg" alt="">
      <p class="kicker">친구들과 함께하는 온라인 살인 추리 보드게임</p>
      <h1 class="title">밤의 저택</h1>
      <p class="tagline">폭풍우 치는 밤, 저택의 주인이 살해되었다.<br>누가, 무엇으로, 어디서?</p>
    </div>
    <div class="home-card paper">
      <div class="paper-stamp">사건 접수</div>
      <label class="lbl" for="nameInput">탐정 이름</label>
      <input id="nameInput" class="input" maxlength="10" placeholder="닉네임 (최대 10자)" autocomplete="off">
      <button id="createBtn" class="btn btn-gold btn-lg wide"><i class="ic ic-plus"></i>새 사건 만들기</button>
      <div class="or"><span>또는 초대 코드로 입장</span></div>
      <div class="join-row">
        <input id="codeInput" class="input code" maxlength="4" placeholder="ABCD" autocomplete="off">
        <button id="joinBtn" class="btn btn-dark btn-lg">입장</button>
      </div>
    </div>
    <div class="how">
      <div class="how-step"><i class="ic ic-dice"></i><b>이동</b><span>주사위를 굴려 저택의 방으로 들어간다</span></div>
      <div class="how-step"><i class="ic ic-search"></i><b>추리</b><span>방 안에서 범인과 흉기를 지목한다</span></div>
      <div class="how-step"><i class="ic ic-cards"></i><b>반박</b><span>다른 탐정이 카드를 나에게만 몰래 보여준다</span></div>
      <div class="how-step"><i class="ic ic-gavel"></i><b>고발</b><span>봉투 속 진실을 맞히면 승리, 틀리면 탈락</span></div>
    </div>
  </div>
</section>

<!-- 대기실 -->
<section id="lobby" class="screen" hidden>
  <header class="bar">
    <div class="bar-brand"><img src="assets/logo.svg" alt=""><span>밤의 저택</span></div>
    <div class="bar-mid">
      <div class="room-code"><span>초대 코드</span><b id="lobbyCode">----</b></div>
      <button class="btn btn-dark btn-sm" id="copyLinkBtn"><i class="ic ic-link"></i>초대 링크 복사</button>
    </div>
    <div class="bar-right">
      <button class="icon-btn" data-mute title="소리 켜기/끄기"><i class="ic ic-volume"></i></button>
      <button class="btn btn-dark btn-sm" data-leave><i class="ic ic-door"></i>나가기</button>
    </div>
  </header>
  <div class="lobby">
    <div class="lobby-main">
      <h2 class="h2">용의자를 고르세요 <small>한 사람당 한 명 · 2~6명</small></h2>
      <div id="charGrid" class="char-grid"></div>
      <div id="spectators" class="spectators"></div>
      <div class="lobby-actions">
        <button id="addBotBtn" class="btn btn-dark"><i class="ic ic-bot"></i>AI 탐정 추가</button>
        <button id="spectateBtn" class="btn btn-dark"><i class="ic ic-eye"></i>관전으로 전환</button>
        <div class="grow"></div>
        <span id="startHint" class="hint"></span>
        <button id="startBtn" class="btn btn-gold btn-lg"><i class="ic ic-play"></i>수사 시작</button>
      </div>
    </div>
    <aside class="lobby-side panel" id="lobbyChatMount"></aside>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="screen" hidden>
  <header class="bar">
    <div class="bar-brand"><img src="assets/logo.svg" alt=""><span>밤의 저택</span><em id="gameCode"></em></div>
    <div id="turnBanner" class="turn-banner"></div>
    <div class="bar-right">
      <button class="btn btn-dark btn-sm" id="rulesBtn" title="게임 방법 열기/닫기"><i class="ic ic-help"></i>룰</button>
      <button class="icon-btn" data-mute title="소리 켜기/끄기"><i class="ic ic-volume"></i></button>
      <button class="btn btn-dark btn-sm" id="hostLobbyBtn" hidden>대기실로</button>
      <button class="btn btn-dark btn-sm" data-leave><i class="ic ic-door"></i>나가기</button>
    </div>
  </header>
  <div class="game" id="gameGrid">
    <aside class="panel rules-panel" id="rulesPanel"></aside>
    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="boardToast" class="board-toast"></div>
    </div>
    <aside class="side">
      <div id="playersStrip" class="players"></div>
      <div class="panel turn-panel" id="turnPanel"></div>
      <div class="panel sugg-panel" id="suggPanel" hidden></div>
      <div class="panel tabs-panel">
        <nav class="tabs" id="tabs">
          <button data-tab="hand" class="on"><i class="ic ic-cards"></i>내 카드</button>
          <button data-tab="notes"><i class="ic ic-notebook"></i>수첩</button>
          <button data-tab="log"><i class="ic ic-scroll"></i>기록</button>
          <button data-tab="chat"><i class="ic ic-chat"></i>채팅<span class="badge" id="chatBadge" hidden></span></button>
        </nav>
        <div class="tab" id="tab-hand"></div>
        <div class="tab" id="tab-notes" hidden></div>
        <div class="tab" id="tab-log" hidden></div>
        <div class="tab tab-chat" id="tab-chat" hidden></div>
      </div>
    </aside>
  </div>
</section>

<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toasts" class="toasts"></div>

<a class="back-hub" id="backHub" href="/"><i class="ic ic-next"></i>다른 보드게임 고르기</a>

<template id="chatTpl">
  <div class="chat">
    <div class="chat-log"></div>
    <form class="chat-form">
      <input class="input" maxlength="200" placeholder="메시지 입력" autocomplete="off">
      <button class="btn btn-gold btn-sm" type="submit" title="보내기"><i class="ic ic-send"></i></button>
    </form>
  </div>
</template>

<div id="film" hidden></div>
<script src="/socket.io/socket.io.js"></script>
<script src="shared/data.js"></script>
<script src="js/sfx.js"></script>
<script type="importmap">
{ "imports": { "three": "/clue/vendor/three/build/three.module.js", "three/addons/": "/clue/vendor/three/examples/jsm/" } }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
