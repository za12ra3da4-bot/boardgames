<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보드게임 밤</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Rye&family=Jua&family=Nanum+Myeongjo:wght@800&family=Cinzel:wght@700;900&family=Fredoka:wght@600;700&family=Hahmlet:wght@700;900&family=Song+Myung&family=Gowun+Batang:wght@700&family=Special+Elite&family=Playfair+Display+SC:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="/anim/anim.css">
<link rel="stylesheet" href="/common/social.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <img class="brand-mark" src="assets/favicon.svg" alt="">
    <div>
      <div class="brand-name">보드게임 밤</div>
      <div class="brand-sub">친구들이랑 같이 하는 온라인 보드게임</div>
    </div>
  </div>
  <div class="addr" title="친구에게 이 주소를 알려 주세요">
    <span>친구용 주소</span>
    <code id="addr-url">—</code>
    <button type="button" id="copy" class="btn">복사</button>
  </div>
  <a id="accBtn" class="acc-top" href="profile.html" title="내 캐릭터 꾸미기"><span>로그인 · 캐릭터 꾸미기</span></a>
  <a id="artBtn" class="btn admin-btn" href="art.html" hidden>그림 넣기</a>
  <button type="button" id="filmBtn" class="btn admin-btn" hidden>결말 영상 보기</button>
  <button type="button" id="adminBtn" class="btn admin-btn">관리자</button>
</header>

<div class="dialog" id="adminDialog" hidden>
  <form class="dialog-box" id="adminForm">
    <b>관리자 로그인</b>
    <p>게임 방법 영상 링크를 추가하거나 지울 수 있어요.</p>
    <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
    <div class="dialog-err" id="adminErr" hidden></div>
    <div class="dialog-btns">
      <button type="button" class="btn ghost" id="adminCancel">취소</button>
      <button type="submit" class="btn">로그인</button>
    </div>
  </form>
</div>

<div class="dialog" id="filmDialog" hidden>
  <div class="dialog-box film-box">
    <b>결말 영상 미리 보기</b>
    <p>게임을 하지 않아도 끝날 때 나오는 영상을 볼 수 있어요. (관리자 전용)</p>
    <div class="film-list" id="filmList"></div>
    <div class="dialog-btns"><button type="button" class="btn ghost" id="filmClose">닫기</button></div>
  </div>
</div>
<div id="filmHost" hidden></div>

<main class="wrap">
  <div class="shelf-head">
    <h1>오늘은 <em>뭐</em> 할래?</h1>
    <p>게임 상자를 누르면 바로 방을 만들 수 있어요.</p>
  </div>
  <section class="shelf" id="shelf" aria-busy="true">
    <div class="loading">게임 상자를 꺼내는 중…</div>
  </section>
</main>

<script src="js/hub.js"></script>
<script type="module">
import { getMe } from '/common/me.js';
import { avatarSvg, PARTS } from '/common/avatar.js';
const a = document.getElementById('accBtn');
const u = await getMe();
const face = avatarSvg(u ? u.profile.avatar : PARTS.DEFAULT, { crop: 'head', bg: true });
a.innerHTML = face + (u ? '<span><small></small><b></b></span>' : '<span><small>로그인하고</small><b>캐릭터 꾸미기</b></span>');
if (u) { a.querySelector('small').textContent = u.profile.title; a.querySelector('b').textContent = u.profile.nickname; }
</script>
</body>
</html>
