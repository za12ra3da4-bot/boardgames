<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보드게임 밤</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Rye&family=Nanum+Myeongjo:wght@800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <img class="brand-mark" src="assets/favicon.svg" alt="">
    <div>
      <div class="brand-name">보드게임 밤</div>
      <div class="brand-sub">친구들이랑 같이 하는 온라인 보드게임</div>
    </div>
  </div>
  <div class="addr" title="친구에게 이 주소를 알려 주세요">
    <span>친구용 주소</span>
    <code id="addr-url">—</code>
    <button type="button" id="copy" class="btn">복사</button>
  </div>
</header>

<main class="wrap">
  <div class="shelf-head">
    <h1>오늘은 <em>뭐</em> 할래?</h1>
    <p>게임 상자를 누르면 바로 방을 만들 수 있어요.</p>
  </div>
  <section class="shelf" id="shelf" aria-busy="true">
    <div class="loading">게임 상자를 꺼내는 중…</div>
  </section>
</main>

<script src="js/hub.js"></script>
</body>
</html>
