# Render.com 무료 서버 설정 (Render 대시보드 → New → Blueprint → 이 저장소 선택)
services:
  - type: web
    name: boardgames
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # 관리자 비밀번호: 값은 Render 대시보드(Environment)에서 직접 넣는다. 저장소에는 올리지 않는다.
      - key: ADMIN_PASSWORD
        sync: false
