<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 상자 앞면을 그려서 사진(png)으로 굽는다: scripts/bake.sh 참고 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
  html,body{margin:0;background:#000}
  .box{position:relative; width:900px; height:900px; overflow:hidden; font-family:'Noto Sans KR',sans-serif;
    background:radial-gradient(720px 620px at 66% 46%, #ffc24a 0%, #f78a1e 38%, #e2560f 70%, #a82c08 100%);}
  .dots{position:absolute; inset:0; opacity:.14;
    background-image:radial-gradient(circle at 2px 2px,#5a1a04 2px,transparent 2px); background-size:13px 13px}
  .rays{position:absolute; left:64%; top:46%; width:1600px; height:1600px; transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg, rgba(255,236,170,.2) 0deg 8deg, transparent 8deg 16deg); opacity:.6}
  .crawl{position:absolute; inset:0; opacity:.3}
  .crawl i{position:absolute; display:block}
  .author{position:absolute; left:54px; top:40px; color:#7a1e04; font-weight:900; font-size:18px; letter-spacing:3px}
  .pub{position:absolute; right:38px; top:34px; text-align:center; color:#2a0e04; font-weight:900; font-size:14px; letter-spacing:1px; line-height:1.3}
  .pub .mark{display:flex; gap:6px; justify-content:center; margin-bottom:7px}
  .pub .mark i{display:block; width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent; border-bottom:27px solid #2a0e04}
  h1{position:absolute; left:44px; top:88px; margin:0; font-family:'Black Han Sans',sans-serif; font-size:122px; line-height:.88;
    color:#fff3d0; -webkit-text-stroke:12px #2a0e04; paint-order:stroke fill; text-shadow:10px 12px 0 #8a2204; letter-spacing:-3px}
  h1 em{display:block; font-style:normal; margin-left:44px; color:#ffd84e}
  .spark{position:absolute; color:#ffe98a; font-size:34px; text-shadow:0 0 14px rgba(255,220,120,.9)}
  .burst{position:absolute; left:44px; bottom:172px; width:286px; height:286px; display:grid; place-items:center; text-align:center;
    color:#2a0e04; font-family:'Jua',sans-serif; font-size:25px; line-height:1.28;
    background:conic-gradient(from 8deg, #fff2b8 0deg 9deg, #ffd23a 9deg 18deg);
    clip-path:polygon(50% 0,60% 14%,72% 4%,76% 20%,90% 14%,88% 30%,100% 30%,92% 44%,100% 54%,88% 62%,96% 76%,80% 76%,82% 92%,68% 84%,62% 100%,50% 88%,38% 100%,32% 84%,18% 92%,20% 76%,4% 76%,12% 62%,0 54%,8% 44%,0 30%,12% 30%,10% 14%,24% 20%,28% 4%,40% 14%);
    transform:rotate(-9deg)}
  .burst span{display:block; padding:0 46px}
  .burst b{font-size:37px; display:block; color:#b02008; margin:2px 0}
  .band{position:absolute; left:0; right:0; bottom:0; height:100px; background:#2a0e04; display:flex; align-items:center; gap:24px; padding:0 36px; color:#ffd88a; font-weight:900}
  .band .item{display:flex; align-items:center; gap:9px; font-size:25px}
  .band .item svg{width:36px; height:36px}
  .band .sep{width:2px; height:42px; background:#7a4a1a}
  .band .en{margin-left:auto; font-size:18px; letter-spacing:5px; color:#f0a860}
  .hero{position:absolute; right:-16px; bottom:76px; width:530px; filter:drop-shadow(-16px 14px 0 rgba(120,30,4,.35))}
  .fan{position:absolute; right:296px; bottom:214px; width:300px}
</style></head><body>
<div class="box">
  <div class="rays"></div><div class="dots"></div><div class="crawl" id="crawl"></div>
  <div class="author">BUG BLUFF GAMES</div>
  <div class="pub"><div class="mark"><i></i><i></i><i></i></div>세 마리<br>벌레출판</div>
  <h1>바퀴벌레<em>포커</em></h1>
  <div class="spark" style="left:398px; top:104px">✦</div>
  <div class="spark" style="left:346px; top:208px; font-size:24px">✦</div>
  <div class="spark" style="left:214px; top:66px; font-size:22px">✦</div>
  <div class="burst"><span>믿을까<b>속을까</b>한 장의 거짓말</span></div>
  <svg class="hero" viewBox="-10 20 620 740" id="hero"></svg>
  <div class="band">
    <div class="item"><svg viewBox="0 0 40 40"><circle cx="13" cy="12" r="7" fill="#ffd88a"/><path d="M2 36c0-8 22-8 22 0z" fill="#ffd88a"/><circle cx="29" cy="14" r="6" fill="#f0a860"/><path d="M20 36c0-7 18-7 18 0z" fill="#f0a860"/></svg>2~6명</div>
    <div class="sep"></div>
    <div class="item"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#ffd88a" stroke-width="4"/><path d="M20 10v11l8 5" stroke="#ffd88a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>20분</div>
    <div class="sep"></div>
    <div class="item"><svg viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" rx="8" fill="none" stroke="#ffd88a" stroke-width="4"/><text x="20" y="28" text-anchor="middle" font-family="'Noto Sans KR'" font-weight="900" font-size="19" fill="#ffd88a">8+</text></svg>8세 이상</div>
    <div class="en">COCKROACH POKER</div>
  </div>
</div>
<script src="../public/shared/roach.js"></script>
<script src="../public/js/cards.js"></script>
<script>
// 상자 주인공: 나비넥타이 매고 카드를 든 능글맞은 바퀴 (직접 그린다)
const INK = '#1a1008';
document.getElementById('hero').innerHTML = `
  <g transform="translate(40 0)">
    <!-- 다리 · 구두 -->
    <g stroke="${INK}" stroke-width="17" stroke-linecap="round" fill="none">
      <path d="M212 610 L182 700"/><path d="M290 612 L316 700"/>
    </g>
    <path d="M150 700 q34 -22 60 0 q-6 22 -34 22 q-26 0 -26 -22Z" fill="#2a0e04" stroke="${INK}" stroke-width="9"/>
    <path d="M352 700 q-34 -22 -60 0 q6 22 34 22 q26 0 26 -22Z" fill="#2a0e04" stroke="${INK}" stroke-width="9"/>
    <!-- 등 뒤로 숨긴 카드를 쥔 팔 -->
    <g stroke="${INK}" stroke-width="20" stroke-linecap="round" fill="none"><path d="M318 372 Q412 402 446 470"/></g>
    <g transform="translate(452 486) rotate(24)"><rect x="-34" y="-48" width="68" height="96" rx="9" fill="#7a2010" stroke="${INK}" stroke-width="8"/>
      <rect x="-24" y="-38" width="48" height="76" rx="6" fill="#c8621e" opacity=".6"/></g>
    <ellipse cx="440" cy="474" rx="30" ry="24" transform="rotate(22 440 474)" fill="#7a3208" stroke="${INK}" stroke-width="10"/>
    <!-- 몸통: 붉은 연미복 -->
    <path d="M250 300 Q160 312 140 420 Q120 540 150 616 Q250 646 350 616 Q380 540 360 420 Q340 312 250 300Z" fill="#c8202a" stroke="${INK}" stroke-width="14"/>
    <path d="M250 300 Q340 312 360 420 Q380 540 350 616 Q300 632 250 632Z" fill="#8a1018"/>
    <path d="M206 318 Q250 392 250 632 L196 620 Q168 520 178 400Z" fill="#fdf4e2" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>
    <path d="M294 318 Q250 392 250 632 L304 620 Q332 520 322 400Z" fill="#2a0e04" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>
    <path d="M206 318 L250 386 L294 318 L266 296 L250 312 L234 296Z" fill="#2a0e04" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>
    <path d="M214 336 L250 372 L286 336 L272 322 L250 338 L228 322Z" fill="#e8c020" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="250" cy="470" r="9" fill="${INK}"/><circle cx="250" cy="520" r="9" fill="${INK}"/>
    <!-- 겉날개가 옷자락 아래로 살짝 -->
    <path d="M150 594 Q250 660 350 594 Q330 664 250 672 Q170 664 150 594Z" fill="#7a3208" stroke="${INK}" stroke-width="10"/>
    <path d="M250 612 V672" stroke="${INK}" stroke-width="7"/>
    <!-- 카드 든 팔 -->
    <g stroke="${INK}" stroke-width="22" stroke-linecap="round" fill="none"><path d="M176 380 Q96 414 66 470"/></g>
    <ellipse cx="62" cy="478" rx="32" ry="26" transform="rotate(-22 62 478)" fill="#7a3208" stroke="${INK}" stroke-width="10"/>
    <!-- 더듬이 -->
    <path d="M186 172 Q104 92 62 44" stroke="${INK}" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M320 172 Q404 96 470 62" stroke="${INK}" stroke-width="15" fill="none" stroke-linecap="round"/>
    <circle cx="62" cy="44" r="12" fill="${INK}"/><circle cx="470" cy="62" r="12" fill="${INK}"/>
    <!-- 머리 -->
    <ellipse cx="252" cy="212" rx="126" ry="104" fill="#c8621e" stroke="${INK}" stroke-width="14"/>
    <path d="M252 108 q116 12 122 96 q6 88 -122 100Z" fill="#7a3208" opacity=".28"/>
    <!-- 중절모 -->
    <path d="M104 152 Q252 88 400 154 Q252 202 104 152Z" fill="#2a0e04" stroke="${INK}" stroke-width="11" stroke-linejoin="round"/>
    <path d="M164 150 Q170 36 254 30 Q340 34 344 152 Q252 182 164 150Z" fill="#2a0e04" stroke="${INK}" stroke-width="11" stroke-linejoin="round"/>
    <path d="M168 116 Q254 146 342 116 L344 148 Q252 178 166 148Z" fill="#c8202a"/>
    <!-- 눈 · 웃음 -->
    <ellipse cx="206" cy="196" rx="40" ry="44" fill="#fffdf4" stroke="${INK}" stroke-width="11"/>
    <ellipse cx="306" cy="196" rx="40" ry="44" fill="#fffdf4" stroke="${INK}" stroke-width="11"/>
    <circle cx="220" cy="204" r="18" fill="${INK}"/><circle cx="316" cy="202" r="18" fill="${INK}"/>
    <circle cx="213" cy="196" r="7" fill="#fff"/><circle cx="309" cy="194" r="7" fill="#fff"/>
    <path d="M160 156 L232 178 M352 154 L286 176" stroke="${INK}" stroke-width="14" stroke-linecap="round"/>
    <path d="M172 252 Q252 330 340 246 Q322 308 252 310 Q190 310 172 252Z" fill="#fffdf4" stroke="${INK}" stroke-width="12" stroke-linejoin="round"/>
    <path d="M200 268 v26 M236 282 v28 M274 282 v28 M310 264 v24" stroke="${INK}" stroke-width="9"/>
    <path d="M340 246 q26 -8 34 -28" stroke="${INK}" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>`;
// 들고 있는 카드 세 장
const fan = document.createElement('div');
fan.className = 'fan';
fan.innerHTML = ['roach0', 'scorpion0', 'toad0'].map((id, i) =>
  `<div style="position:absolute;left:${i * 58}px;bottom:${[0, 30, 50][i]}px;width:150px;transform:rotate(${[-22, -7, 9][i]}deg);filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))">${RCARD.cardSvg(id)}</div>`).join('');
document.querySelector('.box').appendChild(fan);
// 배경에 기어다니는 작은 바퀴들
const crawl = document.getElementById('crawl');
const spots = [[70, 300, 54, -20], [150, 470, 44, 26], [60, 620, 60, 8], [330, 760, 48, -14], [690, 190, 46, 32], [810, 330, 40, -26], [520, 120, 42, 14], [250, 190, 36, -40]];
crawl.innerHTML = spots.map(([x, y, s2, r]) =>
  `<i style="left:${x}px;top:${y}px;width:${s2}px;height:${s2}px;transform:rotate(${r}deg)">
     <svg viewBox="0 0 200 200" width="${s2}" height="${s2}"><g fill="#6a1a04">${RCARD.ART.roach(ROACH.KIND.roach)}</g></svg></i>`).join('');
</script></body></html>
