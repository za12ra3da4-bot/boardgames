<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바람섬 개척기 · 온라인 개척 보드게임</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Cinzel:wght@700&family=Gowun+Batang:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="conn" id="conn" hidden></div>

<!-- 시작 화면 -->
<section id="home" class="screen">
  <div class="home">
    <div class="hero">
      <img class="hero-logo" src="assets/logo.svg" alt="">
      <p class="kicker">친구들과 함께하는 온라인 개척 보드게임</p>
      <h1 class="title">바람섬 <span>개척기</span></h1>
      <p class="tagline">숲에서 목재를, 언덕에서 벽돌을.<br>길을 내고 마을을 세워 먼저 10점을 차지하라.</p>
      <div class="hero-tiles">
        <img src="assets/tile/forest-1.svg" alt=""><img src="assets/tile/hills-2.svg" alt=""><img src="assets/tile/pasture-1.svg" alt="">
        <img src="assets/tile/fields-2.svg" alt=""><img src="assets/tile/mountains-1.svg" alt="">
      </div>
    </div>
    <div class="join-card">
      <div class="jc-head">개척단 모집</div>
      <label class="lbl" for="nameInput">이름</label>
      <input id="nameInput" class="input" maxlength="10" placeholder="닉네임 (최대 10자)" autocomplete="off">
      <button id="createBtn" class="btn btn-red btn-lg wide"><i class="ic ic-plus"></i>새 방 만들기</button>
      <div class="or"><span>또는 초대 코드로 입장</span></div>
      <div class="join-row">
        <input id="codeInput" class="input code" maxlength="4" placeholder="ABCD" autocomplete="off">
        <button id="joinBtn" class="btn btn-dark btn-lg">입장</button>
      </div>
      <button class="btn btn-dark wide" data-rules><i class="ic ic-help"></i>게임 방법 보기</button>
    </div>
  </div>
</section>

<!-- 대기실 -->
<section id="lobby" class="screen" hidden>
  <header class="bar">
    <div class="bar-brand"><img src="assets/logo.svg" alt=""><span>바람섬 개척기</span></div>
    <div class="bar-mid">
      <div class="room-code"><span>초대 코드</span><b id="lobbyCode">----</b></div>
      <button class="btn btn-dark btn-sm" id="copyLinkBtn"><i class="ic ic-link"></i>초대 링크 복사</button>
    </div>
    <div class="bar-right">
      <button class="btn btn-dark btn-sm" data-rules><i class="ic ic-help"></i>룰</button>
      <button class="icon-btn" data-mute title="소리 켜기/끄기"><i class="ic ic-volume"></i></button>
      <button class="btn btn-dark btn-sm" data-leave><i class="ic ic-door"></i>나가기</button>
    </div>
  </header>
  <div class="lobby">
    <div class="lobby-main">
      <h2 class="h2">개척단 명단 <small>3~4명 · 차례와 색깔은 시작할 때 무작위</small></h2>
      <div id="seatGrid" class="seat-grid"></div>
      <div id="spectators" class="spectators"></div>
      <div class="lobby-actions">
        <button id="addBotBtn" class="btn btn-dark"><i class="ic ic-bot"></i>AI 개척자 추가</button>
        <button id="seatBtn" class="btn btn-dark"><i class="ic ic-eye"></i>관전으로 전환</button>
        <div class="grow"></div>
        <span id="startHint" class="hint"></span>
        <button id="startBtn" class="btn btn-red btn-lg"><i class="ic ic-play"></i>개척 시작</button>
      </div>
      <div class="cost-card big" id="lobbyCost"></div>
    </div>
    <aside class="lobby-side panel" id="lobbyChatMount"></aside>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="screen" hidden>
  <header class="bar">
    <div class="bar-brand"><img src="assets/logo.svg" alt=""><span>바람섬 개척기</span><em id="gameCode"></em></div>
    <div id="turnBanner" class="turn-banner"></div>
    <div class="bar-right">
      <button class="btn btn-dark btn-sm" data-rules><i class="ic ic-help"></i>룰</button>
      <button class="icon-btn" data-mute title="소리 켜기/끄기"><i class="ic ic-volume"></i></button>
      <button class="btn btn-dark btn-sm" id="hostLobbyBtn" hidden>대기실로</button>
      <button class="btn btn-dark btn-sm" data-leave><i class="ic ic-door"></i>나가기</button>
    </div>
  </header>
  <div class="game">
    <aside class="left">
      <div class="panel players" id="players"></div>
      <div class="cost-card" id="costCard"></div>
      <div class="panel bankbox" id="bankBox"></div>
    </aside>
    <main class="center">
      <div class="table" id="table">
        <svg id="board" class="board" viewBox="-420 -390 840 780" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="dice" id="dice"></div>
        <div class="trade-box" id="tradeBox" hidden></div>
      </div>
      <div class="me-area">
        <div class="action-bar" id="actionBar"></div>
        <div class="hand-row">
          <div class="hand" id="hand"></div>
          <div class="devs" id="devs"></div>
        </div>
      </div>
    </main>
    <aside class="side panel">
      <nav class="tabs" id="tabs">
        <button data-tab="log" class="on"><i class="ic ic-scroll"></i>기록</button>
        <button data-tab="chat"><i class="ic ic-chat"></i>채팅<span class="badge" id="chatBadge" hidden></span></button>
      </nav>
      <div class="tab" id="tab-log"></div>
      <div class="tab tab-chat" id="tab-chat" hidden></div>
    </aside>
  </div>
</section>

<a class="back-hub" id="backHub" href="/"><i class="ic ic-next"></i>다른 보드게임 고르기</a>

<div id="zoom" class="zoom" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toasts" class="toasts"></div>
<div id="flyLayer" class="fly-layer"></div>

<template id="chatTpl">
  <div class="chat">
    <div class="chat-log"></div>
    <form class="chat-form">
      <input class="input" maxlength="200" placeholder="메시지 입력" autocomplete="off">
      <button class="btn btn-red btn-sm" type="submit" title="보내기"><i class="ic ic-send"></i></button>
    </form>
  </div>
</template>

<script src="/socket.io/socket.io.js"></script>
<script src="shared/isle.js"></script>
<script src="js/sfx.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
